<div class="register-page">
    <div class="register-card">

        <!-- Form Section -->
        <section class="form-section">

            <div class="form-content">

                <h2>Create account</h2>

                <!-- <p class="subtitle">
                    Let’s get started with your 30 days trial
                </p> -->

                <form (ngSubmit)="createAccount()">

                    <!-- Name -->
                    <div class="form-field">
                        <input type="text" name="name" placeholder="Name" autocomplete="name" required />
                    </div>

                    <!-- Email -->
                    <div class="form-field">
                        <input type="email" name="email" placeholder="Email" autocomplete="email" required />
                    </div>

                    <!-- Password -->
                    <div class="form-field password-field">

                        <input [type]="showPassword() ? 'text' : 'password'" name="password" placeholder="Password"
                            autocomplete="new-password" required />

                        <button type="button" class="password-toggle" (click)="togglePassword()"
                            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
                            @if (showPassword()) {
                            <span>◉</span>
                            } @else {
                            <span>◉̸</span>
                            }
                        </button>

                    </div>

                    <!-- Submit -->
                    <button type="submit" class="create-button">
                        Create account
                    </button>

                </form>

                <!-- Login -->
                <p class="login-text">
                    Already have an account?
                    <button type="button" class="login-link" (click)="login()">
                        Login
                    </button>
                </p>

                <!-- Social Login -->
                <div class="social-login">

                    <button type="button" class="social-button" aria-label="Continue with Google"
                        (click)="socialLogin('google')">
                        <span class="google-icon">G</span>
                    </button>

                    <!-- <button type="button" class="social-button active" aria-label="Continue with Apple"
                        (click)="socialLogin('apple')">
                        <span class="apple-icon">●</span>
                    </button> -->

                    <button type="button" class="social-button" aria-label="Continue with Facebook"
                        (click)="socialLogin('facebook')">
                        <span class="facebook-icon">f</span>
                    </button>

                </div>

            </div>

        </section>

        <!-- Illustration Section -->


    </div>
</div>
